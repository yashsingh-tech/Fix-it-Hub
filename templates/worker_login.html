<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Worker Login - FixItHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-house-chimney"></i></div>
        <div class="logo-text">
          <span class="logo-name">FixIt<span class="logo-accent">Hub</span></span>
          <span class="logo-tagline">Your Home, Our Priority</span>
        </div>
      </div>
      <a href="/" class="btn-call">
        <i class="fas fa-house"></i> Home
      </a>
    </div>
  </nav>

  <!-- LOGIN FORM -->
  <section class="hero">
    <div class="section-container">
      <div class="worker-box" style="max-width:500px; margin: 40px auto;">
        <h2 class="worker-title">Worker Login 🔐</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <p style="color:red; text-align:center; margin-bottom:16px;">⚠️ {{ message }}</p>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="/worker/login">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required/>
          </div>
          <div class="input-group" style="margin-bottom:24px;">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required/>
          </div>
          <button type="submit" class="btn-add-worker" style="width:100%; justify-content:center;">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>
        <p style="text-align:center; margin-top:16px; color:#6B7280;">
          New worker? <a href="/worker/register" style="color:#2563EB; font-weight:600;">Register here</a>
        </p>
      </div>
    </div>
  </section>

</body>
</html>
