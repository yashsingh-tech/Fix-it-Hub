<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - FixItHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-house-chimney"></i></div>
        <div class="logo-text">
          <span class="logo-name">FixIt<span class="logo-accent">Hub</span></span>
          <span class="logo-tagline">Your Home, Our Priority</span>
        </div>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="section-container">
      <div class="worker-box" style="max-width:400px; margin:40px auto;">
        <h2 class="worker-title">Admin Login 🔐</h2>

        {% if error %}
          <p style="color:red; text-align:center; margin-bottom:16px;">⚠️ {{ error }}</p>
        {% endif %}

        <form method="POST" action="/admin">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-user"></i>
            <input type="text" name="username" placeholder="Username" required/>
          </div>
          <div class="input-group" style="margin-bottom:24px;">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" required/>
          </div>
          <button type="submit" class="btn-add-worker" style="width:100%; justify-content:center;">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>
      </div>
    </div>
  </section>

</body>
</html>
