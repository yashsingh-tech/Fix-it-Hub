<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Worker Register - FixItHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-house-chimney"></i></div>
        <div class="logo-text">
          <span class="logo-name">FixIt<span class="logo-accent">Hub</span></span>
          <span class="logo-tagline">Your Home, Our Priority</span>
        </div>
      </div>
      <a href="/" class="btn-call">
        <i class="fas fa-house"></i> Home
      </a>
    </div>
  </nav>

  <!-- REGISTER FORM -->
  <section class="hero">
    <div class="section-container">
      <div class="worker-box" style="max-width:500px; margin: 40px auto;">
        <h2 class="worker-title">Worker Register 👷</h2>
        {% if error %}
          <p class="form-error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/worker/register">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-user"></i>
            <input type="text" name="name" placeholder="Full Name" required/>
          </div>
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-phone"></i>
            <input type="tel" name="phone" placeholder="Phone Number" minlength="7" maxlength="20" required/>
          </div>
          <div class="input-group select-group" style="margin-bottom:16px;">
            <i class="fas fa-briefcase"></i>
            <select name="service" required>
               <option value="" disabled selected>Select Service</option>
              <option value="plumber">Plumber</option>
              <option value="ac_repair">AC Repair</option>
              <option value="carpenter">Carpenter</option>
              <option value="electrician">Electrician</option>
              <option value="water_supply">Water Supply</option>
              <option value="cleaning">Cleaning</option>
              <option value="iron_service">Iron Service</option>
              <option value="ro_service">RO Service</option>
              <option value="painting">Painting Service</option>
              <option value="false_ceiling">False Ceiling / POP</option>
              <option value="tile_marble">Tile / Marble Work</option>
              <option value="packers_movers">Packers & Movers</option>
            </select>
            <i class="fas fa-chevron-down select-arrow"></i>
          </div>
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="Email Address" required/>
          </div>
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" name="address" placeholder="Your Area/Address (e.g. Vaishali Nagar, Jaipur)" required/>
          </div>
          <div class="input-group" style="margin-bottom:24px;">
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="Password" minlength="8" required/>
          </div>
          <button type="submit" class="btn-add-worker" style="width:100%; justify-content:center;">
            <i class="fas fa-user-plus"></i> Register
          </button>
        </form>
        <p style="text-align:center; margin-top:16px; color:#6B7280;">
          Already have account? <a href="/worker/login" style="color:#2563EB; font-weight:600;">Login here</a>
        </p>
      </div>
    </div>
  </section>

</body>
</html>
