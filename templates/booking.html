<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Worker - FixItHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-house-chimney"></i></div>
        <div class="logo-text">
          <span class="logo-name">FixIt<span class="logo-accent">Hub</span></span>
          <span class="logo-tagline">Your Home, Our Priority</span>
        </div>
      </div>
      <a href="/" class="btn-call">
        <i class="fas fa-house"></i> Home
      </a>
    </div>
  </nav>

  <section class="hero">
    <div class="section-container">
      <div class="worker-box" style="max-width:500px; margin:40px auto;">
        <h2 class="worker-title">Book Worker 📅</h2>

        <div style="background:#EFF6FF; border-radius:12px; padding:16px; margin-bottom:24px; text-align:center;">
          <p style="font-size:18px; font-weight:700; color:#1D4ED8;">{{ worker[1] }}</p>
          <p style="color:#6B7280;">{{ worker[3] | replace('_', ' ') | title }}</p>
          <p style="color:#6B7280;"><i class="fas fa-phone"></i> {{ worker[2] }}</p>
          <p style="color:#6B7280;"><i class="fas fa-map-marker-alt"></i> {{ worker[6] if worker[6] else 'Address not provided' }}</p>
        </div>

        {% if error %}
          <p class="form-error">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/book/{{ worker[0] }}">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-user"></i>
            <input type="text" name="customer_name" placeholder="Your Name" required/>
          </div>
          <div class="input-group" style="margin-bottom:16px;">
            <i class="fas fa-phone"></i>
            <input type="tel" name="customer_phone" placeholder="Your Phone Number" minlength="7" maxlength="20" required/>
          </div>
          <div class="input-group" style="margin-bottom:24px;">
            <i class="fas fa-map-marker-alt"></i>
            <input type="text" name="customer_address" placeholder="Your Address" required/>
          </div>
          <button type="submit" class="btn-add-worker" style="width:100%; justify-content:center;">
            <i class="fas fa-calendar-check"></i> Confirm Booking
          </button>
        </form>
      </div>
    </div>
  </section>

</body>
</html>
