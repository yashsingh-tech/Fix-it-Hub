<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Worker Dashboard - FixItHub</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">
        <div class="logo-icon"><i class="fas fa-house-chimney"></i></div>
        <div class="logo-text">
          <span class="logo-name">FixIt<span class="logo-accent">Hub</span></span>
          <span class="logo-tagline">Your Home, Our Priority</span>
        </div>
      </div>
      <a href="/worker/logout" class="btn-call">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>
  </nav>

  <!-- DASHBOARD -->
  <section class="hero">
    <div class="section-container">
      <div class="worker-box" style="max-width:600px; margin: 40px auto;">

        <h2 class="worker-title">Welcome, {{ name }}! 👋</h2>

        <div style="text-align:center; margin-bottom:32px;">
          <span style="background:#EFF6FF; color:#2563EB; padding:8px 20px; border-radius:100px; font-weight:600; font-size:15px;">
            <i class="fas fa-briefcase"></i> {{ service | replace('_', ' ') | title }}
          </span>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div style="background:#F0FDF4; border-radius:16px; padding:24px; text-align:center;">
            <i class="fas fa-clock" style="font-size:32px; color:#22C55E;"></i>
            <p style="font-size:24px; font-weight:700; margin:8px 0;">0</p>
            <p style="color:#6B7280;">Pending Orders</p>
          </div>
          <div style="background:#EFF6FF; border-radius:16px; padding:24px; text-align:center;">
            <i class="fas fa-check-circle" style="font-size:32px; color:#2563EB;"></i>
            <p style="font-size:24px; font-weight:700; margin:8px 0;">0</p>
            <p style="color:#6B7280;">Completed Orders</p>
          </div>
        </div>

        <div style="margin-top:24px; background:#FFFBEB; border-radius:16px; padding:20px; text-align:center;">
          <i class="fas fa-info-circle" style="color:#F59E0B;"></i>
          <p style="color:#6B7280; margin-top:8px;">Booking system coming soon! Customers will be able to book you directly.</p>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
